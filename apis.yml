  - Streaming
  - WebSocket
  tags_raw:
  - Realtime
  - Streaming
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.vocode.dev/open-source/how-it-works
  baseURL: https://api.vocode.dev/v1
